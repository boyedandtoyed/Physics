server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    # nginx 1.28's mime.types covers wasm, woff and woff2 but not ttf/otf, which it would
    # otherwise serve as application/octet-stream. A `types` block replaces the inherited map
    # wholesale, so it is scoped to a location that serves nothing else. This regex location
    # takes precedence over /assets/, hence the repeated cache header.
    location ~* \.(ttf|otf)$ {
        types { font/ttf ttf; font/otf otf; }
        default_type font/ttf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
